services:

  mysql:
    image: mysql:8.0
    container_name: user-auth-mysql

    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: user_auth

    ports:
      - "3307:3306"

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot123"]
      interval: 5s
      timeout: 5s
      retries: 10


  backend:
    build:
      context: ./user-auth
      dockerfile: Dockerfile

    container_name: user-auth-backend-container

    environment:
      DB_PASSWORD: root123
      JWT_SECRET: MadhavSecretKeyForJwtAuthenticationProject2026

    depends_on:
      mysql:
        condition: service_healthy

    ports:
      - "8080:8080"


  frontend:
    build:
      context: ./user-auth-frontend
      dockerfile: Dockerfile

    container_name: user-auth-frontend-container

    ports:
      - "3000:80"

    depends_on:
      - backend